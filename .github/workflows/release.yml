name: Release

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - "main"

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_REPOSITORY || format('{0}/sandbox', secrets.DOCKER_USERNAME) }}
      KOYEB_REGISTRY: registry.prod.koyeb.com
      KOYEB_IMAGE: ${{ startsWith(secrets.KOYEB_REGISTRY_REPOSITORY, 'registry.prod.koyeb.com/') && secrets.KOYEB_REGISTRY_REPOSITORY || format('{0}/{1}', 'registry.prod.koyeb.com', secrets.KOYEB_REGISTRY_REPOSITORY || 'koyeb/sandbox') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Test
        run: make test

      - name: Build
        run: make build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to Koyeb Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.KOYEB_REGISTRY }}
          username: ${{ secrets.KOYEB_REGISTRY_USERNAME }}
          password: ${{ secrets.KOYEB_REGISTRY_PASSWORD }}

      # A BuildKit builder of its own: the default docker driver ignores the zstd compression below and pushes gzip.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push full sandbox (tagged release)
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          outputs: type=image,compression=zstd,force-compression=true,oci-mediatypes=true,push=true
          provenance: false
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.KOYEB_IMAGE }}:${{ github.ref_name }}
            ${{ env.KOYEB_IMAGE }}:latest

      - name: Build and push full sandbox (main)
        if: startsWith(github.ref, 'refs/heads/main')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          outputs: type=image,compression=zstd,force-compression=true,oci-mediatypes=true,push=true
          provenance: false
          build-args: |
            VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:main
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.KOYEB_IMAGE }}:main
            ${{ env.KOYEB_IMAGE }}:sha-${{ github.sha }}

      - name: Build and push sandbox executor (tagged release)
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.scratch
          platforms: linux/amd64
          outputs: type=image,compression=zstd,force-compression=true,oci-mediatypes=true,push=true
          provenance: false
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ${{ env.IMAGE_NAME }}-executor:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}-executor:latest
            ${{ env.KOYEB_IMAGE }}-executor:${{ github.ref_name }}
            ${{ env.KOYEB_IMAGE }}-executor:latest
            ${{ env.IMAGE_NAME }}:slim
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}-slim
            ${{ env.KOYEB_IMAGE }}:slim
            ${{ env.KOYEB_IMAGE }}:${{ github.ref_name }}-slim

      - name: Build and push sandbox executor (main)
        if: startsWith(github.ref, 'refs/heads/main')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.scratch
          platforms: linux/amd64
          outputs: type=image,compression=zstd,force-compression=true,oci-mediatypes=true,push=true
          provenance: false
          build-args: |
            VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}-executor:main
            ${{ env.IMAGE_NAME }}-executor:sha-${{ github.sha }}
            ${{ env.KOYEB_IMAGE }}-executor:main
            ${{ env.KOYEB_IMAGE }}-executor:sha-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:slim
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-slim
            ${{ env.KOYEB_IMAGE }}:slim
            ${{ env.KOYEB_IMAGE }}:sha-${{ github.sha }}-slim

      - name: Build and push dind sandbox (tagged release)
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dind
          platforms: linux/amd64
          outputs: type=image,compression=zstd,force-compression=true,oci-mediatypes=true,push=true
          provenance: false
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ${{ env.IMAGE_NAME }}:dind
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}-dind
            ${{ env.KOYEB_IMAGE }}:dind
            ${{ env.KOYEB_IMAGE }}:${{ github.ref_name }}-dind

      - name: Build and push dind sandbox (main)
        if: startsWith(github.ref, 'refs/heads/main')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dind
          platforms: linux/amd64
          outputs: type=image,compression=zstd,force-compression=true,oci-mediatypes=true,push=true
          provenance: false
          build-args: |
            VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:dind
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-dind
            ${{ env.KOYEB_IMAGE }}:dind
            ${{ env.KOYEB_IMAGE }}:sha-${{ github.sha }}-dind

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: bin/sandbox-executor

      - name: Create Pre-release
        if: startsWith(github.ref, 'refs/heads/main')
        uses: softprops/action-gh-release@v1
        with:
          files: bin/sandbox-executor
          prerelease: true
          tag_name: "commit-${{ github.sha }}"
          name: "Pre-release for commit ${{ github.sha }}"

  # Copies the images pushed above to the MAIS CDN (cdn-images.mistralai.com is a CNAME of
  # mistralaishared.azurecr.io), under docker/3rdparty/<image>: the path the MAIS mirror uses for docker.io/<image>.
  mais-cdn:
    needs: release
    runs-on: ubuntu-latest
    # The Azure federated credential trusts repo:koyeb/sandbox-container:environment:production,
    # one subject for both main and tag builds.
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_REPOSITORY || format('{0}/sandbox', secrets.DOCKER_USERNAME) }}
      MAIS_CDN_REPOSITORY: mistralaishared.azurecr.io/docker/3rdparty
      VERSION_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('sha-{0}', github.sha) }}
      MOVING_TAG: ${{ startsWith(github.ref, 'refs/tags/') && 'latest' || 'main' }}
    steps:
      - name: Set up crane
        uses: imjasonh/setup-crane@v0.4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to MAIS CDN registry
        run: az acr login --name mistralaishared

      # koyeb/sandbox is what the MAIS cloud-runtime-dataplane chart runs for the executor DaemonSet.
      - name: Copy sandbox and sandbox executor images to MAIS CDN
        run: |
          for image in "${IMAGE_NAME}" "${IMAGE_NAME}-executor"; do
            crane copy "${image}:${VERSION_TAG}" "${MAIS_CDN_REPOSITORY}/${image}:${VERSION_TAG}"
            crane tag "${MAIS_CDN_REPOSITORY}/${image}:${VERSION_TAG}" "${MOVING_TAG}"
          done
